apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: release-console-run-
  namespace: default
  labels:
    app: release-console
    tier: pipeline-execution
spec:
  pipelineRef:
    name: release-console-pipeline
  taskRunTemplate:
    serviceAccountName: release-console-pipeline-sa
  params:
    - name: repo-url
      value: "https://github.com/balaji-devx/Tekton-Demo.git"
    - name: revision
      value: "main"
    - name: dockerhub-username
      value: "ba1aj1"
    - name: image-tag
      value: "v1"
    - name: app-version
      value: "v1"
    - name: git-commit
      value: "a15b0f890494498aa4d36451c6d437fe3bee6b17"
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: release-console-pvc
    - name: docker-credentials
      secret:
        secretName: dockerhub-auth




